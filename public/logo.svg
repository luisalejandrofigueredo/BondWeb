  <!-- O: anillo -->
  <circle cx="170" cy="66" r="38" fill="none" stroke="#C01163" stroke-width="16"/>
  <!-- mini grafo dentro de la O -->
  <g stroke="#C01163" stroke-width="3.2" fill="#C01163">
    <line x1="157" y1="59" x2="183" y2="59"/>
    <line x1="157" y1="59" x2="157" y2="78"/>
    <line x1="183" y1="59" x2="183" y2="78"/>
    <line x1="157" y1="59" x2="183" y2="78"/>
    <line x1="183" y1="59" x2="157" y2="78"/>
    <line x1="157" y1="78" x2="183" y2="78"/>
    <path d="M 159 59 A 11 11 0 0 1 181 59" fill="none" stroke-width="3.6"/>
    <circle cx="157" cy="59" r="7" stroke="none"/>
