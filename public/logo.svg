  </g>
  <text x="226" y="102" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" letter-spacing="1" fill="#C01163">N</text>
  <text x="316" y="102" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" letter-spacing="1" fill="#C01163">D</text>
  <!-- tagline -->
  <text x="235" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="15" letter-spacing="2" fill="#9AA7BD">GRAFOS · ANÁLISIS JUDICIAL · SEGURIDAD</text>
